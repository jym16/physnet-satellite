  deadline: "April 30, 2026, Anywhere on Earth"
  description: >-
    The satellite welcomed contributions spanning mathematics, physics,
    material science, computer science, biophysics, and related areas.
    Topics included 3D and 2D spatial networks, morphology and function,
    network materials, contact networks, brain networks, packings, and
    related systems.

