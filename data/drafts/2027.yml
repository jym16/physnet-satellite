description: >-
  Physical networks aim to understand complex systems subjected to physical
  constraints, such as volume exclusion or repulsive forces, that shape their
  topological and geometric organization. Systems as diverse as neurons, cellular
  cytoskeletons, vascular structures, porous and colloidal networks, and
  disordered metamaterials are composed of nodes and links that are physical
  objects and cannot overlap with each other.

