- time: 14:05 to 14:40
  title: Understanding the role of physicality in networks
  presenter: Albert-László Barabási
  type: talk
  session: Session I
  authors:
  - Albert-László Barabási
  affiliations: []
  abstract: I will explore the applications of the network science toolset to physical networks, like the brain or metamaterials, which are networks whose links are physical entities that cannot cross each other. Link physicality affects both the evolution and the structure of a network, in a way that is not captured by current graph-based approaches. Yet, the existence of an exact mapping between physical networks and independent sets allows us to derive the onset of physical effects and the emergence of a jamming transition, demonstrating that physicality impacts the network structure even when the total volume of the links is negligible.
- time: 14:40 to 15:05
  title: 'Modeling the inter-areal cortical network based on a distance rule: from the macaque to the mouse'
  presenter: Maria Ercsey-Ravasz
  type: talk
  session: Session I
  authors:
  - Maria Ercsey-Ravasz
  affiliations: []
  abstract: Mammals show a wide range of brain sizes, reflecting adaptation to diverse habitats. Comparing inter-areal cortical networks across brains of different sizes and mammalian orders provides robust information on evolutionarily preserved features and species-specific processing modalities. However, these networks are spatially embedded, directed, and weighted, making comparisons challenging. Analysis of the large-scale connectome inferred from a consistent database of retrograde tracer experiments in the macaque cortex has shown that many of its local, global, and weighted properties are well predicted by a simple network model based on an exponential distance rule. Here we show that the large-scale connectome of the mouse and rat cortex is also strongly determined by an exponential distance rule but with a different decay rate. Comparisons reveal network invariants between species, exemplified in motif profiles and connection similarity indices, but also significant differences,
    including fractionally smaller and much weaker long-distance connections in the macaque than in the mouse.
- time: 15:05 to 15:30
  title: A network-of-networks model for physical networks
  presenter: Ádám Timár
  type: talk
  session: Session I
  authors:
  - Ádám Timár
  affiliations: []
  abstract: 'Physical networks are networks represented in Euclidean space with edges thought of as physical objects with constraints, for example that they cannot intersect. We define a model through a dynamical process: a sequence of loop-erased random walks on the grid, run until they hit the previously constructed piece of the network. The trajectory of one such walk will then be a vertex of the corresponding abstract network, with adjacencies given by how the trajectories hit. Relying on this representation, we model the growth of physical networks and show that volume exclusion induces heterogeneity in both node volume and degree, with the two becoming correlated. Calculating the Laplacian spectra of these networks, we show that these correlations strongly affect their function.'
