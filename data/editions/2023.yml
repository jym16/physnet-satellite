description: Physical networks are complex systems subjected to physical constraints, such as volume exclusion or repulsive forces, that shape their networked organization. Systems such as neurons, fiber networks, cell cytoskeletons, and mycorrhizal architectures are composed of links and nodes that are physical objects and therefore cannot overlap with each other.
