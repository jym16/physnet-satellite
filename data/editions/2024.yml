description: Physical networks aim to understand complex systems subjected to physical constraints, such as volume exclusion or repulsive forces, that shape their topological and geometric organization. Systems as different as neurons, porous and colloidal networks, and disordered metamaterials are made of links and nodes that are physical objects and cannot overlap with each other.
