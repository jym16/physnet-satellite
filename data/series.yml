title: "Physical Networks"
subtitle: "NetSci Satellite Series"
description: >-
  The Physical Networks satellite series brings together researchers working on
  networks whose nodes and links are physical objects embedded in space.

scope:
  - physical networks
  - spatial networks
  - network geometry
  - soft and disordered matter
  - biological networks
  - metamaterials
  - random packings
  - topology and geometry of embedded networks

